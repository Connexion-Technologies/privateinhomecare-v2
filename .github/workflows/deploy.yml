name: Deploy (PM2 reload)

on:
  push:
    branches: [ clean-admin-dashboard ]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Install dependencies
      - name: Install dependencies
        run: npm install

      # 4. Build app (IMPORTANT - happens here, not on server)
      - name: Build app
        run: npm run build

      # 5. Add SSH key
      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      # 6. Trust server
      - name: Trust host
        run: ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      # 7. Deploy ONLY dist + needed files
      - name: Upload build to server
        run: |
          rsync -avz --delete \
            -e "ssh -p ${SSH_PORT:-22}" \
            dist package.json ecosystem.config.cjs \
            $SSH_USER@$SSH_HOST:/var/www/html/privateinhomecare/
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}

      # 8. Install prod deps + reload PM2
      - name: Restart app
        run: |
          ssh -p ${SSH_PORT:-22} $SSH_USER@$SSH_HOST << 'EOF'
            set -e
            cd /var/www/html/privateinhomecare

            # Install only production deps (lightweight)
            npm install --omit=dev
            npm install dotenv


            # Restart app
            pm2 startOrReload ecosystem.config.cjs --env production
            pm2 save
          EOF
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
